name: Mindsay
description: 'Mindsay (formerly Destygo) was a Paris-based conversational AI platform that
  built chatbot and virtual-assistant automation for customer service and support teams, with a
  focus on travel and hospitality use cases. It was surfaced as a portfolio company of Partech and
  added to the API Evangelist network. As of this enrichment pass the standalone mindsay.com brand
  is no longer serving a live site or developer surface (the company was acquired by Laivly), so no
  public API, developer portal, or documentation could be located to profile.'
